services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vdev_quest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vdev_quest"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    build:
      context: ./infrastructure/minio
      dockerfile: Dockerfile.server
    image: vdev-quest/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    build:
      context: ./infrastructure/minio
      dockerfile: Dockerfile.mc
    image: vdev-quest/minio-mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-ec"]
    command: ["until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/vdev-evidence; mc anonymous set none local/vdev-evidence"]
    depends_on:
      minio:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./infrastructure/keycloak/vdev-quest-realm.json:/opt/keycloak/data/import/vdev-quest-realm.json:ro

volumes:
  postgres_data:
  minio_data:

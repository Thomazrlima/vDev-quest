services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vdev_quest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vdev_quest"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    build:
      context: ./infrastructure/minio
      dockerfile: Dockerfile.mc
    image: vdev-quest/minio-mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-ec"]
    command: ["until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/vdev-evidence; mc anonymous set none local/vdev-evidence"]
    depends_on:
      minio:
        condition: service_started

  cognito-local:
    image: jagregory/cognito-local:5.3.0
    ports:
      - "9229:9229"
    volumes:
      - cognito_data:/app/.cognito
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(9229, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24

  cognito-init:
    image: amazon/aws-cli:2.27.41
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        endpoint=http://cognito-local:9229
        until aws --endpoint-url "$${endpoint}" cognito-idp list-user-pools >/dev/null 2>&1; do sleep 2; done

        pool_id=$$(aws --endpoint-url "$${endpoint}" cognito-idp list-user-pools --query "UserPools[?Name=='vdev-quest'].Id | [0]" --output text)
        if [ "$${pool_id}" = None ]; then
          pool_id=$$(aws --endpoint-url "$${endpoint}" cognito-idp create-user-pool \
            --pool-name vdev-quest \
            --username-attributes email \
            --auto-verified-attributes email \
            --username-configuration CaseSensitive=false \
            --query UserPool.Id --output text)
        fi

        client_id=$$(aws --endpoint-url "$${endpoint}" cognito-idp list-user-pool-clients \
          --user-pool-id "$${pool_id}" \
          --query "UserPoolClients[?ClientName=='vdev-quest-web'].ClientId | [0]" --output text)
        if [ "$${client_id}" = None ]; then
          client_id=$$(aws --endpoint-url "$${endpoint}" cognito-idp create-user-pool-client \
            --user-pool-id "$${pool_id}" \
            --client-name vdev-quest-web \
            --no-generate-secret \
            --allowed-o-auth-flows-user-pool-client \
            --allowed-o-auth-flows code \
            --allowed-o-auth-scopes openid profile email \
            --supported-identity-providers COGNITO \
            --callback-urls http://localhost:3000/ http://localhost:5173/ \
            --logout-urls http://localhost:3000/ http://localhost:5173/ \
            --explicit-auth-flows ALLOW_USER_PASSWORD_AUTH ALLOW_REFRESH_TOKEN_AUTH \
            --query UserPoolClient.ClientId --output text)
        fi

        while IFS='|' read -r email first_name last_name; do
          if ! aws --endpoint-url "$${endpoint}" cognito-idp admin-get-user \
            --user-pool-id "$${pool_id}" --username "$${email}" >/dev/null 2>&1; then
            aws --endpoint-url "$${endpoint}" cognito-idp admin-create-user \
              --user-pool-id "$${pool_id}" \
              --username "$${email}" \
              --message-action SUPPRESS \
              --user-attributes "Name=email,Value=$${email}" "Name=email_verified,Value=true" "Name=name,Value=$${first_name} $${last_name}" >/dev/null
          fi
          aws --endpoint-url "$${endpoint}" cognito-idp admin-set-user-password \
            --user-pool-id "$${pool_id}" --username "$${email}" \
            --password vdev-local --permanent >/dev/null
        done <<'USERS'
        admin@vdev.local|Administradora|Local
        colaborador@vdev.local|Aventureiro|Local
        ana.silva@vdev.local|Ana|Silva
        bruno.lima@vdev.local|Bruno|Lima
        carla.souza@vdev.local|Carla|Souza
        diego.rocha@vdev.local|Diego|Rocha
        elisa.costa@vdev.local|Elisa|Costa
        USERS

        printf 'Cognito Local ready: pool_id=%s client_id=%s issuer=http://localhost:9229/%s jwks=http://localhost:9229/%s/.well-known/jwks.json\n' "$${pool_id}" "$${client_id}" "$${pool_id}" "$${pool_id}"
    depends_on:
      cognito-local:
        condition: service_healthy
    restart: "no"
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: vdev-quest/backend:latest
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/vdev_quest
      DATABASE_USERNAME: vdev_app
      DATABASE_PASSWORD: vdev_app
      FLYWAY_USERNAME: postgres
      FLYWAY_PASSWORD: postgres
      OIDC_ISSUER_URI: http://cognito-local:9229/us-east-1_vdevquest
      OIDC_JWK_SET_URI: http://cognito-local:9229/us-east-1_vdevquest/.well-known/jwks.json
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      cognito-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
  cognito_data:

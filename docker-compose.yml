services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vdev_quest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vdev_quest"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    build:
      context: ./infrastructure/minio
      dockerfile: Dockerfile.mc
    image: vdev-quest/minio-mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-ec"]
    command: ["until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/vdev-evidence; mc anonymous set none local/vdev-evidence"]
    depends_on:
      minio:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/keycloak/vdev-quest-realm.json:/opt/keycloak/data/import/vdev-quest-realm.json:ro

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: vdev-quest/backend:latest
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/vdev_quest
      DATABASE_USERNAME: vdev_app
      DATABASE_PASSWORD: vdev_app
      FLYWAY_USERNAME: postgres
      FLYWAY_PASSWORD: postgres
      OIDC_ISSUER_URI: http://localhost:8180/realms/vdev-quest
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/vdev-quest/protocol/openid-connect/certs
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  keycloak_data:
